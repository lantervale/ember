<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="base">
      <stop offset="0" stop-color="#fc0"/>
      <stop offset=".5" stop-color="#c06" stop-opacity=".6"/>
      <stop offset="1" stop-color="#06c"/>
    </linearGradient>
    <linearGradient id="down" xlink:href="#base" x2="0" y2="1"/>
    <linearGradient id="slant" href="#base" gradientTransform="rotate(30 .5 .5)"/>
    <linearGradient id="user" href="#base" gradientUnits="userSpaceOnUse" x1="10" x2="30" spreadMethod="reflect"/>
    <linearGradient id="again" href="#user" spreadMethod="repeat"/>
    <linearGradient id="hard">
      <stop offset=".3" stop-color="#222"/>
      <stop offset=".3" stop-color="#eee"/>
      <stop offset=".7" stop-color="#eee"/>
      <stop offset=".7" stop-color="#c00"/>
    </linearGradient>
    <radialGradient id="ball" cx=".4" cy=".35" r=".7" fx=".3" fy=".25">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".5" stop-color="#4a6"/>
      <stop offset="1" stop-color="#021"/>
    </radialGradient>
    <radialGradient id="rings" href="#base" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="8" spreadMethod="repeat"/>
    <radialGradient id="oval" href="#base" gradientTransform="translate(.5 .5) scale(1 .5) translate(-.5 -.5)"/>
    <radialGradient id="halo" fr=".2"><stop stop-color="#fff"/><stop offset="1" stop-color="#306"/></radialGradient>
  </defs>
  <rect x="2" y="2" width="36" height="36" fill="url(#base)"/>
  <rect x="42" y="2" width="36" height="36" fill="url(#down)"/>
  <rect x="82" y="2" width="36" height="36" fill="url(#slant)"/>
  <rect x="2" y="42" width="36" height="36" fill="url(#user)"/>
  <rect x="42" y="42" width="36" height="36" fill="url(#again)" transform="rotate(8 60 60)"/>
  <rect x="82" y="42" width="36" height="36" rx="8" fill="url(#hard)" stroke="url(#down)" stroke-width="4"/>
  <circle cx="20" cy="100" r="18" fill="url(#ball)"/>
  <ellipse cx="60" cy="100" rx="18" ry="12" fill="url(#oval)"/>
  <circle cx="100" cy="100" r="18" fill="url(#rings)"/>
  <circle cx="60" cy="60" r="9" fill="url(#halo)" fill-opacity=".8"/>
</svg>
