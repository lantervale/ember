<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="smear"><feGaussianBlur stdDeviation="6 0"/></filter>
    <filter id="widen" x="-50%" y="-50%" width="200%" height="200%"><feMorphology operator="dilate" radius="4 0"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="0" stdDeviation="1.5" flood-color="#036"/></filter>
    <filter id="grain" x="0" y="0" width="1" height="1"><feTurbulence baseFrequency=".3 .02" numOctaves="2"/><feComposite in2="SourceAlpha" operator="in"/></filter>
  </defs>
  <rect x="20" y="20" width="30" height="30" fill="#c33" transform="rotate(30 35 35)" filter="url(#smear)"/>
  <rect x="70" y="20" width="30" height="30" fill="#36c" transform="skewX(20)" filter="url(#widen)"/>
  <rect x="20" y="70" width="30" height="20" fill="#2a7" transform="rotate(45 35 80)" filter="url(#widen)"/>
  <g transform="rotate(-60 90 90)"><rect x="75" y="80" width="30" height="20" rx="4" fill="#e60" filter="url(#shadow)"/></g>
  <rect x="64" y="56" width="20" height="40" transform="rotate(20 74 76)" filter="url(#grain)"/>
</svg>
