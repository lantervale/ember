  </defs>
  <rect x="2" y="2" width="36" height="36" fill="url(#dots)"/>
  <rect x="42" y="2" width="36" height="36" fill="url(#quarter)"/>
  <circle cx="100" cy="20" r="18" fill="url(#boxed)"/>
  <rect x="2" y="42" width="36" height="36" fill="url(#stripes)"/>
  <rect x="80" y="40" width="40" height="40" fill="url(#viewed)"/>
  <rect x="42" y="42" width="36" height="36" fill="url(#again) #f00"/>
  <circle cx="20" cy="100" r="14" fill="none" stroke="url(#lines)" stroke-width="8"/>
  <rect x="42" y="82" width="36" height="36" fill="url(#offset)" opacity=".8"/>
