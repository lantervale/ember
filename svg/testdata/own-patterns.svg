<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120">
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="8" height="8"><rect width="8" height="8" fill="#fed"/><circle cx="4" cy="4" r="2.5" fill="#c33"/></pattern>
    <pattern id="quarter" width=".25" height=".25"><rect width="4" height="4" fill="#36c"/></pattern>
    <pattern id="boxed" patternContentUnits="objectBoundingBox" width=".5" height=".5"><rect width=".25" height=".25" fill="#2a7"/><rect x=".25" y=".25" width=".25" height=".25" fill="#063"/></pattern>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="3" height="6" fill="#93c"/></pattern>
    <pattern id="viewed" patternUnits="userSpaceOnUse" x="80" y="40" width="10" height="10" viewBox="0 0 20 20"><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#e60"/></pattern>
    <pattern id="again" href="#dots" patternTransform="scale(.5)"/>
