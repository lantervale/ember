<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" font-family="sans-serif">
  <defs>
    <path id="arc" d="M14 102 A46 22 0 0 1 106 102"/>
    <path id="wave" d="M6 112 C30 104 50 120 70 110 S100 106 116 110" transform="translate(0 4)"/>
  </defs>
  <rect width="120" height="120" fill="#fed"/>
  <text x="4" y="14" font-size="11" letter-spacing="2">spaced out</text>
  <text x="4" y="28" font-size="11" word-spacing="8" fill="#36c">a few wide words</text>
  <text x="116" y="42" font-size="11" text-anchor="end" style="letter-spacing: .2em" fill="#2a7">anchored</text>
  <text x="4" y="42" font-size="11" text-decoration="underline" fill="#c33">under</text>
  <text x="60" y="56" font-size="12" text-anchor="middle" style="text-decoration: line-through" fill="#93c">struck <tspan fill="#e60">through</tspan></text>
  <text x="4" y="72" font-size="10" text-decoration="overline underline" fill="#06c" stroke="#333" stroke-width=".3">both lines</text>
  <use href="#arc" fill="none" stroke="#ccc"/>
  <text font-size="10" fill="#333"><textPath href="#arc" startOffset="8">along an arc of text</textPath></text>
  <text font-size="9" fill="#c06"><textPath href="#wave" startOffset="50%" text-anchor="middle">a wave of letters</textPath></text>
</svg>
