<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="boxed" primitiveUnits="objectBoundingBox"><feGaussianBlur stdDeviation=".05"/><feOffset dx=".1" dy=".1"/></filter>
    <filter id="user" filterUnits="userSpaceOnUse" x="40" y="0" width="30" height="40"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="sub"><feFlood flood-color="#fc0" x="10%" y="10%" width="40%" height="40%" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="subuser"><feGaussianBlur stdDeviation="3" x="84" y="0" width="20" height="60"/></filter>
    <filter id="empty"/>
    <filter id="turned"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="named"><feOffset dx="3" result="a"/><feOffset in="SourceGraphic" dx="-3" result="b"/><feBlend in="a" in2="b" mode="darken"/></filter>
    <filter id="alpha"><feOffset in="SourceAlpha" dx="2" dy="2"/></filter>
  </defs>
  <rect width="120" height="120" fill="#eef"/>
  <rect x="8" y="8" width="24" height="24" fill="#c33" filter="url(#boxed)"/>
  <rect x="40" y="8" width="36" height="24" fill="#36c" filter="url(#user)"/>
  <rect x="84" y="8" width="28" height="28" fill="#2a7" filter="url(#sub)"/>
  <rect x="8" y="48" width="24" height="24" fill="#93c" filter="url(#empty)"/>
  <rect x="40" y="48" width="32" height="24" fill="#e60" filter="url(#missing)"/>
  <rect x="84" y="44" width="28" height="28" fill="#06c" filter="url(#subuser)"/>
  <g filter="url(#turned)" transform="rotate(20 20 100)"><rect x="8" y="88" width="24" height="24" fill="#333"/></g>
  <g filter="url(#named)"><circle cx="60" cy="100" r="10" fill="#c33"/><circle cx="60" cy="100" r="5" fill="#fc0"/></g>
  <path d="M86 88 h24 v24 z" fill="#2a7" fill-opacity=".5" filter="url(#alpha)"/>
</svg>
