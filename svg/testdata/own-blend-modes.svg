<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ramp"><stop stop-color="#f60"/><stop offset=".5" stop-color="#3c9"/><stop offset="1" stop-color="#36f"/></linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#ramp)"/>
  <rect x="0" y="0" width="120" height="30" fill="#fff" fill-opacity=".5"/>
  <g fill="#c39">
    <circle cx="12" cy="14" r="9" style="mix-blend-mode: multiply"/>
