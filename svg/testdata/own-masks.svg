<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="fade"><stop stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <mask id="disc"><circle cx="20" cy="20" r="16" fill="#fff"/></mask>
    <mask id="ramp"><rect x="40" width="40" height="40" fill="url(#fade)"/></mask>
    <mask id="grey"><rect x="82" y="2" width="36" height="36" fill="#808080"/><circle cx="100" cy="20" r="10" fill="#fff" fill-opacity=".5"/></mask>
    <mask id="units" maskContentUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".45" fill="#fff"/><circle cx=".5" cy=".5" r=".2" fill="#000"/></mask>
    <mask id="alpha" style="mask-type: alpha"><rect x="42" y="42" width="36" height="36" fill="#000" fill-opacity=".4"/><circle cx="60" cy="60" r="12" fill="#00f"/></mask>
    <mask id="region" maskUnits="userSpaceOnUse" x="85" y="45" width="30" height="20"><rect x="80" y="40" width="40" height="40" fill="#fff"/></mask>
    <mask id="tinted"><rect width="120" height="120" fill="#f00"/><rect x="20" width="10" height="120" fill="#0f0"/><rect x="30" width="10" height="120" fill="#00f"/></mask>
    <mask id="edge"><rect x="40" y="80" width="40" height="40" fill="#fff"/></mask>
    <mask id="spot"><circle cx="100" cy="100" r="16" fill="#fff"/></mask>
    <clipPath id="cut"><circle cx="60" cy="100" r="16"/></clipPath>
  </defs>
  <rect width="40" height="40" fill="#c33" mask="url(#disc)"/>
  <rect x="40" width="40" height="40" fill="#36c" mask="url(#ramp)"/>
  <rect x="80" width="40" height="40" fill="#2a7" mask="url(#grey)"/>
  <rect x="2" y="42" width="36" height="36" fill="#93c" mask="url(#units)"/>
  <rect x="40" y="40" width="40" height="40" fill="#e60" mask="url(#alpha)"/>
  <rect x="80" y="40" width="40" height="40" fill="#06c" mask="url(#region)"/>
  <rect y="80" width="40" height="40" fill="#333" mask="url(#tinted)"/>
  <g mask="url(#edge)" clip-path="url(#cut)" opacity=".8"><rect x="40" y="80" width="40" height="40" fill="#c06"/><rect x="40" y="96" width="40" height="8" fill="#fc0"/></g>
  <rect x="82" y="82" width="36" height="36" rx="6" fill="#333" stroke="#fc0" stroke-width="4" style="mask: url(#spot)"/>
</svg>
