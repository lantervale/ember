# Keeps this repository's issues and pull requests on the project "Lantervale studio" in step: added when opened, their
# Status following their assignee, review and close. The rules are lantervale/studio's .github/project-status.sh, run
# from its main; the same file is in each repository of the organisation.
name: Project status

on:
  issues:
    types: [opened, reopened, assigned, unassigned, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, assigned, unassigned, closed]

permissions: {}

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Status on the project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ACTION: ${{ github.event.action }}
          KIND: ${{ github.event.pull_request && 'pull' || 'issue' }}
          NODE_ID: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
          BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
          ASSIGNEES: ${{ github.event.issue && toJSON(github.event.issue.assignees) || toJSON(github.event.pull_request.assignees) }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          ASSIGNEES=$(jq length <<<"$ASSIGNEES") \
            bash <(gh api -H 'Accept: application/vnd.github.raw' repos/lantervale/studio/contents/.github/project-status.sh)
