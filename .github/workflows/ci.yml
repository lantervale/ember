# Tests ember on macOS, Windows and Linux through its Taskfile: the
# GPU-free tests, the GPU tests on a software adapter where the runner has
# no GPU (lavapipe on Linux, WARP on Windows; skipped, saying so, when a
# macOS runner's Metal is out of reach), the ui pages against a pinned
# Chrome in shards, one job each, and every example built for the browser
# and run in Chrome;
# golangci-lint on the whole tree, on each OS and on the browser's build;
# and a scan for leaked secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gpu: lavapipe
            golden-share: "0.05"
            run: xvfb-run -a
          - os: macos-latest
            gpu: metal
            golden-share: ""
            run: ""
          - os: windows-latest
            gpu: warp
            golden-share: "0.05"
            run: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux libraries (GLFW's X11 and Wayland headers, ALSA, Vulkan with lavapipe, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libvulkan-dev mesa-vulkan-drivers xvfb

      - name: Tool settings and reports in the runner's temp
        run: |
          {
            echo "EMBER_TILESET_DIR=$RUNNER_TEMP/tileset"
            case "${{ matrix.gpu }}" in
              lavapipe | warp) echo "EMBER_WGPU_FALLBACK=1" ;;
              metal) echo "EMBER_GPU_OPTIONAL=1" ;;
            esac
            if [ -n "${{ matrix.golden-share }}" ]; then
              echo "EMBER_GOLDEN_SHARE=${{ matrix.golden-share }}"
            fi
          } >> "$GITHUB_ENV"

      - name: wgpu-native
        run: task wgpu

      - name: Tests
        run: task test

      - name: GPU tests (${{ matrix.gpu }})
        run: |
          status=0
          EMBER_GOLDEN_REPORT="$RUNNER_TEMP/golden.md" ${{ matrix.run }} task test:gpu 2>&1 | tee "$RUNNER_TEMP/gpu.log" || status=$?
          {
            echo "### GPU tests on ${{ matrix.os }} (${{ matrix.gpu }})"
            cat "$RUNNER_TEMP/golden.md" 2>/dev/null || grep -E "no GPU adapter" "$RUNNER_TEMP/gpu.log" || echo "no goldens compared"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # The ui Chrome suites, pixel pages and kit cards, split into shards
  # (task test:chrome, ui/internal/shard), one job each, two Chromes at
  # once in each.
  chrome:
    name: chrome ${{ matrix.os }} ${{ matrix.shard }}/4
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [0, 1, 2, 3]
        include:
          - os: ubuntu-latest
            gpu: lavapipe
            run: xvfb-run -a
          - os: macos-latest
            gpu: metal
            run: ""
          - os: windows-latest
            gpu: warp
            run: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      EMBER_CHROME_SLOTS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux libraries (GLFW's X11 and Wayland headers, ALSA, Vulkan with lavapipe, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libvulkan-dev mesa-vulkan-drivers xvfb

      - name: Tool settings and reports in the runner's temp
        run: |
          {
            echo "EMBER_CHROME_REPORTS=$RUNNER_TEMP/chrome-reports"
            echo "CHROME_VERSION=$(tr -d '[:space:]' < ui/internal/chrome/VERSION)"
            case "${{ matrix.gpu }}" in
              lavapipe | warp) echo "EMBER_WGPU_FALLBACK=1" ;;
              metal) echo "EMBER_GPU_OPTIONAL=1" ;;
            esac
          } >> "$GITHUB_ENV"

      - name: wgpu-native
        run: task wgpu

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}

      # Ubuntu 24.04 keeps unprivileged user namespaces from the AppArmor
      # profile Chrome's sandbox needs ("No usable sandbox!"): allow them.
      - name: Chrome's sandbox on Linux
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: ui pages against Chrome ${{ env.CHROME_VERSION }}, shard ${{ matrix.shard }} of 4
        env:
          EMBER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          status=0
          ${{ matrix.run }} task test:chrome SHARDS=4 ONLY=${{ matrix.shard }} JOBS=2 || status=$?
          {
            echo "### ui against Chrome $CHROME_VERSION on ${{ matrix.os }}, shard ${{ matrix.shard }} of 4"
            cat "$EMBER_CHROME_REPORTS/summary.md" 2>/dev/null || echo "no summary.md: the pages didn't run"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Chrome reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-reports-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ env.EMBER_CHROME_REPORTS }}
          if-no-files-found: ignore

